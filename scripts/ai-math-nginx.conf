server {
    listen 80;
    server_name 8.134.195.113;

    location /health {
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    location / {
        root /opt/ai-math/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
